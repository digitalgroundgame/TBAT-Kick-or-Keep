# Publish a live, public demo of the control room + overlay to GitHub Pages.
#
# This repo deploys ITSELF -- nothing outside it pushes to its Pages branch.
# One publisher per surface; two writers on one artifact is how a deploy
# silently reverts someone else's.
#
# The demo runs with no relay (the control room's own preview is driven by
# postMessage), so a visitor sees the real graphic without installing anything.
name: Publish demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Refuse to publish a copy that does not match its own manifest. A demo
      # serving different bytes from the kit is worse than no demo: it is the
      # drift this repo's one-writer rule exists to prevent, wearing a URL.
      - name: Verify before publishing
        run: node verify.mjs
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p site
          cp overlay.html control-room.html manifest.json EVENTS.md README.md site/
          # relay.js and README-kit.md are LINKED from the control room, so a
          # site without them serves a page whose download buttons 404 while
          # looking perfectly fine.
          cp relay.js README-kit.md site/
          # The control room is the landing page: the overlay is transparent by
          # design and looks like nothing on its own.
          cp control-room.html site/index.html
          ls -la site

      - name: Build the kit zip the demo offers
        run: |
          set -eu
          # kit.zip is NOT committed -- a build artifact in git history is paid
          # for by every clone forever, and a rebuild adds a copy rather than
          # replacing one. So it is built here, from the files verify.mjs has
          # already checked, and laid out exactly as the upstream kit is.
          rm -rf kitbuild && mkdir -p kitbuild/tugofwar-kit
          cp overlay.html control-room.html relay.js EVENTS.md kitbuild/tugofwar-kit/
          cp README-kit.md kitbuild/tugofwar-kit/README.md
          cp manifest.json kitbuild/tugofwar-kit/
          # python3's stdlib rather than the `zip` binary: one less thing that
          # has to happen to be installed on the runner image.
          ( cd kitbuild && python3 -m zipfile -c ../site/kit.zip tugofwar-kit )
          ( cd site && sha256sum kit.zip > kit.zip.sha256 )
          # A zip whose members do not match the manifest served beside it is
          # the exact drift this repo's one-writer rule exists to prevent, so
          # refuse to publish rather than ship it.
          node -e '
            const fs = require("fs"), cp = require("child_process");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const crypto = require("crypto");
            const local = { "README.md": "README-kit.md" };
            let bad = 0;
            for (const [name, meta] of Object.entries(m.files)) {
              const buf = fs.readFileSync(local[name] || name);
              const sha = crypto.createHash("sha256").update(buf).digest("hex");
              if (sha !== meta.sha256) { bad++; console.error("MISMATCH " + name); }
            }
            if (bad) { console.error("refusing to publish a kit that disagrees with its manifest"); process.exit(1); }
            console.log("kit.zip matches manifest.json (" + Object.keys(m.files).length + " files)");
          '
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
